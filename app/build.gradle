apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.3"

    defaultConfig {
        // FIXED: applicationId cannot contain 'src' or dots in that format.
        // Changed to a valid Android package identifier matching your Java package.
        applicationId "com.shooter.game"
        minSdkVersion 19
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    // REQUIRED: Links this Android module to your core game logic
    implementation project(':core')

    // REQUIRED: LibGDX Android backend (matches your existing SDK 29 / minSdk 19 setup)
    // NOTE: Ensure the version below matches the libGDX version defined in your 
    // root-level build.gradle or gradle.properties. If your project uses a 
    // different version variable, replace '1.12.1' with that variable.
    implementation "com.badlogicgames.gdx:gdx-backend-android:1.12.1"

    // REQUIRED: Native libraries for Android (armeabi-v7a, arm64-v8a, x86, x86_64)
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-x86_64"
}

// REQUIRED: Copies native .so files into the APK assets/libs folder
task copyAndroidNatives() {
    doFirst {
        configurations.natives.files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
            if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
            if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
            if (jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name.contains("package")) {
        task.dependsOn copyAndroidNatives
    }
}
